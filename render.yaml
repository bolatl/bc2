# Free judges demo. Local JSON files reset when the free service sleeps/restarts.
# Demo card checkout uses the local mock provider; no charges or Stripe account.
# No paid disk, database, or payment provider is provisioned.
services:
  - type: web
    name: lovelab-judges
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /tmp/lovelab/data.json
      - key: DISABLE_PAYWALL
        value: "false"
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: VITE_LLM_MODE
        value: unknown
      - key: VITE_PAYMENT_MODE
        value: mock
      - key: FUNNEL
        value: full
      - key: FREE_TURNS
        value: "5"
      - key: MAX_TURNS
        value: "12"
      - key: ENABLE_CHECKPOINTS
        value: "false"
      - key: ENABLE_REHEARSAL
        value: "true"
