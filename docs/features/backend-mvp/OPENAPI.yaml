              schema:
                type: string
        '401':
          description: Anonymous session missing, invalid, or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Actor or request origin is not permitted.
          content:
            application/json:
