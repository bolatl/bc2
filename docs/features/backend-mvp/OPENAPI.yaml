openapi: 3.1.0
info:
  title: Love Lab Backend MVP
  version: 1.0.0
  description: Anonymous two-partner conversation practice. Backend prompt is the primary requirement source. No real payment
    collection in this MVP.
servers:
- url: http://localhost:8080
security:
- anonymousSession: []
paths:
  /api/v1/couples:
    post:
      operationId: createCouple
      summary: Create couple and role-A cookie
      tags:
      - couples
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleResponse'
          headers:
            Set-Cookie:
              description: Signed anonymous role cookie, or expiry when deleting.
              schema:
                type: string
        '400':
          description: Invalid or malformed JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request exceeds body size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Expected application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Actor or request origin is not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoupleRequest'
  /api/v1/couples/me:
    get:
      operationId: getCouple
      summary: Read current couple status
      tags:
      - couples
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleResponse'
        '401':
          description: Anonymous session missing, invalid, or deleted.
