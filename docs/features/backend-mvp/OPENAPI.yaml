          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteCouple
      summary: Delete all couple data and clear cookie
      tags:
      - couples
      responses:
        '204':
          description: Success.
          headers:
            Set-Cookie:
