        schema: *id001
components:
  securitySchemes:
    anonymousSession:
      type: apiKey
      in: cookie
      name: lovelab_session
      description: HttpOnly HMAC-signed cookie binding couple and role; never construct it in frontend code.
  schemas:
    Age:
      type: string
      enum:
      - 25-29
      - 30-34
      - 35-39
      - 40-45
      - other
    RelationshipStatus:
      type: string
      enum:
      - dating
      - living_together
      - engaged
      - married
    TogetherDuration:
      type: string
      enum:
      - <1
      - 1-3
      - 3-7
      - 7+
    HasKids:
      type: string
      enum:
      - 'no'
      - expecting
      - 'yes'
    ConflictStyle:
      type: string
      enum:
      - talk_now
      - need_space
      - get_loud
      - shut_down
    RepairNeed:
      type: string
      enum:
      - being_heard
      - apology
      - plan
      - closeness
      - alone_time
    FightTopic:
      type: string
      enum:
      - money
      - chores
      - family
      - time_attention
      - phone
      - jealousy
      - closeness
      - plans_decisions
      - kids
      - other
    Goal:
      type: string
      enum:
      - fewer_fights
      - understand_each_other
      - prepare_marriage
      - feel_close
    PartnerRole:
      type: string
      enum:
      - A
      - B
    PartnerBStatus:
      type: string
      enum:
      - not_invited
      - invited
      - in_progress
      - ready
    FightStage:
      type: string
      enum:
      - thermometer_start
      - facts
      - feelings
      - needs
      - partner_view
      - rehearsal
      - thermometer_end
      - ready
    AnswerSource:
      type: string
      enum:
      - card_left
      - card_right
      - free_text
    Plan:
      type: string
      enum:
      - monthly
      - yearly
      - program
    SubscriptionStatus:
      type: string
      enum:
      - none
      - pending
      - active
    RatingColor:
      type: string
      enum:
      - green
      - yellow
      - red
      - gray
    PersonalityLevel:
      type: string
      enum:
      - low
      - mid
      - high
    SessionTier:
      type: string
      enum:
      - free_short
      - full
    SessionStatus:
      type: string
      enum:
      - in_progress
      - awaiting_payment
      - completed
      - stopped_safety
      - skipped
    RecordStatus:
      type: string
      enum:
      - pending
      - rated
      - not_discussed
    CreateCoupleRequest:
      type: object
      additionalProperties: false
      required:
      - age
      - relationshipStatus
      - togetherDuration
      - hasKids
      - conflictStyle
      - repairNeed
      - fightTopics
      - goal
      properties:
        age:
          $ref: '#/components/schemas/Age'
        relationshipStatus:
          $ref: '#/components/schemas/RelationshipStatus'
        togetherDuration:
          $ref: '#/components/schemas/TogetherDuration'
        hasKids:
          $ref: '#/components/schemas/HasKids'
        conflictStyle:
          $ref: '#/components/schemas/ConflictStyle'
        repairNeed:
          $ref: '#/components/schemas/RepairNeed'
        fightTopics:
          type: array
          items:
            $ref: '#/components/schemas/FightTopic'
          description: One to three distinct topics.
          minItems: 1
          maxItems: 3
          uniqueItems: true
        goal:
          $ref: '#/components/schemas/Goal'
    JoinInviteRequest:
      type: object
      additionalProperties: false
      required:
      - age
      - conflictStyle
      - repairNeed
      properties:
        age:
          $ref: '#/components/schemas/Age'
        conflictStyle:
          $ref: '#/components/schemas/ConflictStyle'
        repairNeed:
          $ref: '#/components/schemas/RepairNeed'
    SubscriptionResponse:
      type: object
      additionalProperties: false
      required:
      - plan
      - status
      - activatedAt
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        activatedAt:
          type:
          - string
          - 'null'
          description: RFC 3339 timestamp in UTC.
          format: date-time
    CoupleResponse:
      type: object
      additionalProperties: false
      required:
      - coupleId
      - partnerRole
      - currentSessionId
      - inviteUrl
      - partnerBStatus
      - partnerBInviteSentAt
      - defaultPlan
      - subscription
      - personalityDone
      - createdAt
      properties:
        coupleId: *id001
        partnerRole:
          $ref: '#/components/schemas/PartnerRole'
        currentSessionId:
          type:
          - string
          - 'null'
          minLength: 1
          description: This owner's latest attempt in the current round, including completed, skipped or privately stopped attempts. Null if this owner has no attempt in that round; never another owner's ID.
        inviteUrl:
          type: string
          description: Empty until paid and A is ready; then an absolute frontend invitation URL. Returned only to A.
        partnerBStatus:
          $ref: '#/components/schemas/PartnerBStatus'
        partnerBInviteSentAt:
          type:
          - string
          - 'null'
          description: Time invitation became shareable in the current round; null before readiness; not delivery confirmation.
          format: date-time
        defaultPlan:
          $ref: '#/components/schemas/Plan'
        subscription:
          anyOf:
          - $ref: '#/components/schemas/SubscriptionResponse'
          - type: 'null'
        personalityDone:
          type: boolean
          description: Whether the current role has completed the personality test.
        createdAt: &id002
          type: string
          description: RFC 3339 timestamp in UTC.
          format: date-time
    InviteResponse:
      type: object
      additionalProperties: false
      required:
      - neutralTopic
      - message
      properties:
        neutralTopic:
          anyOf:
          - $ref: '#/components/schemas/FightTopic'
          - type: 'null'
        message:
          type: string
          description: Neutral invitation text without A’s private data.
    JoinInviteResponse:
      type: object
      additionalProperties: false
      required:
      - coupleId
      - partnerRole
      - neutralTopic
      properties:
        coupleId: *id001
        partnerRole:
          type: string
          const: B
        neutralTopic:
          anyOf:
          - $ref: '#/components/schemas/FightTopic'
          - type: 'null'
    SubmitPersonalityTestRequest:
      type: object
      additionalProperties: false
      required:
      - answers
      properties:
        answers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          description: Mini-IPIP answers in the specified 1–20 item order.
          minItems: 20
          maxItems: 20
    TraitResult:
      type: object
      additionalProperties: false
      required:
      - score
      - level
      properties:
        score:
          type: integer
          description: Sum of four direction-corrected item scores.
          minimum: 4
          maximum: 20
        level:
          $ref: '#/components/schemas/PersonalityLevel'
    Traits:
      type: object
      additionalProperties: false
      required:
      - e
      - a
      - c
      - n
      - i
      properties:
        e:
          $ref: '#/components/schemas/TraitResult'
        a:
          $ref: '#/components/schemas/TraitResult'
        c:
          $ref: '#/components/schemas/TraitResult'
        n:
          $ref: '#/components/schemas/TraitResult'
        i:
          $ref: '#/components/schemas/TraitResult'
    PersonalityTestResponse:
      type: object
      additionalProperties: false
      required:
      - traits
      - strengths
      - tips
      - completedAt
      properties:
        traits:
          $ref: '#/components/schemas/Traits'
        strengths:
          type: array
          items:
            type: string
          description: Three plain-language strengths.
          minItems: 3
          maxItems: 3
        tips:
          type: array
          items:
            type: string
          description: Two plain-language tips.
          minItems: 2
          maxItems: 2
        completedAt: *id002
    SubmitTurnRequest:
      type: object
      additionalProperties: false
      required:
      - turnIndex
      - answerSource
      properties:
        turnIndex:
          type: integer
          description: Current zero-based index; stale or duplicate indexes cause conflict.
          minimum: 0
        answerSource:
          $ref: '#/components/schemas/AnswerSource'
        answerText:
          type: string
          description: Required for free_text. For cards use the exact displayed card text or omit it; server resolves the
            stored card.
          maxLength: 300
      allOf:
      - if:
          properties:
            answerSource:
              const: free_text
        then:
          required:
          - answerText
          properties:
            answerText:
              minLength: 1
              pattern: \S
    BackRequest:
      type: object
      additionalProperties: false
      required:
      - turnIndex
      properties:
        turnIndex:
          type: integer
          description: Previously answered index to reopen. Its answer and all later history are erased.
          minimum: 0
    NextTurnResponse:
      type: object
      additionalProperties: false
      required:
      - type
      - stage
      - turnIndex
      - agentQuestion
      - optionLeft
      - optionRight
      - progressStageIndex
      - turnsUsed
      - turnsMax
      properties:
        type:
          type: string
          const: next_turn
        stage:
          $ref: '#/components/schemas/FightStage'
        turnIndex:
          type: integer
          minimum: 0
        agentQuestion:
          type: string
          description: Question for the owner of this session.
        optionLeft:
          type: string
          description: First answer card.
        optionRight:
          type: string
          description: Second answer card.
        progressStageIndex:
          type:
          - integer
          - 'null'
          description: 'Stage progress: facts=1, feelings=2, needs=3, partner_view=4, rehearsal=5, ready=6; null on thermometers.'
          minimum: 1
          maximum: 6
        turnsUsed:
          type: integer
          description: Number of answers accepted in the current branch.
          minimum: 0
        turnsMax:
          type: integer
          description: 'Current budget: FREE_TURNS (3 or 4) for teaser, MAX_TURNS (7–12) for full.'
          minimum: 3
          maximum: 12
    PlanOption:
      type: object
      additionalProperties: false
      required:
      - plan
      - priceUsd
      - isDefault
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        priceUsd:
          type: number
          description: Displayed per-plan USD price.
          minimum: 0
        isDefault:
          type: boolean
          description: Selected by relationship status, not an imposed purchase.
    PaywallResponse:
      type: object
      additionalProperties: false
      required:
      - type
      - availablePlans
      properties:
        type:
          type: string
          const: paywall_required
        availablePlans:
          type: array
          items:
            $ref: '#/components/schemas/PlanOption'
          minItems: 3
          maxItems: 3
    Hotline:
      type: object
      additionalProperties: false
      required:
      - name
      - phone
      properties:
        name:
          type: string
          description: Name and locale of the support resource.
        phone:
          type: string
          description: Display/dial string; never interpret it as a numeric value.
    SafetyStopResponse:
      type: object
      additionalProperties: false
      required:
      - type
      - hotlines
      properties:
        type:
          type: string
          const: safety_stop
        hotlines:
          type: array
          items:
            $ref: '#/components/schemas/Hotline'
          minItems: 1
    CompletedResponse:
      type: object
      additionalProperties: false
      required:
      - type
      - resultUrl
      properties:
        type:
          type: string
          const: completed
        resultUrl:
          type: string
          description: API path to the private session result.
    CheckpointRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - stop
          - continue
          description: stop skips the remaining content stages and goes to ready in short flow or the closing thermometer then ready in full flow; continue resumes the normal order.
    CheckpointSummary:
      type: object
      additionalProperties: false
      required:
      - feltText
      - needText
      - openingLine
      properties:
        feltText:
          type: string
        needText:
          type: string
        openingLine:
          type: string
    CheckpointResponse:
      type: object
      additionalProperties: false
      required:
      - type
      - afterStage
      - summary
      - question
      - decisions
      properties:
        type:
          type: string
          const: checkpoint
        afterStage:
          type: string
          enum:
          - feelings
          - needs
          - partner_view
        summary:
          $ref: '#/components/schemas/CheckpointSummary'
        question:
          type: string
        decisions:
          type: array
          items:
            type: string
            enum:
            - stop
            - continue
          minItems: 2
          maxItems: 2
    TurnResponse:
      oneOf:
      - $ref: '#/components/schemas/NextTurnResponse'
      - $ref: '#/components/schemas/PaywallResponse'
      - $ref: '#/components/schemas/SafetyStopResponse'
      - $ref: '#/components/schemas/CompletedResponse'
      - $ref: '#/components/schemas/CheckpointResponse'
      discriminator:
        propertyName: type
        mapping:
          next_turn: '#/components/schemas/NextTurnResponse'
          paywall_required: '#/components/schemas/PaywallResponse'
          safety_stop: '#/components/schemas/SafetyStopResponse'
          completed: '#/components/schemas/CompletedResponse'
          checkpoint: '#/components/schemas/CheckpointResponse'
    FightTurn:
      type: object
      additionalProperties: false
      required:
      - turnIndex
      - stage
      - agentQuestion
      - optionLeft
      - optionRight
      - answerSource
      - answerText
      properties:
        turnIndex:
          type: integer
          minimum: 0
        stage:
          $ref: '#/components/schemas/FightStage'
        agentQuestion:
          type: string
        optionLeft:
          type: string
        optionRight:
          type: string
        answerSource:
          $ref: '#/components/schemas/AnswerSource'
        answerText:
          type: string
    FightSessionResponse:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - status
      - tier
      - stage
      - turns
      - currentTurn
      - thermometerStart
      - thermometerEnd
      - createdAt
      properties:
        sessionId: *id001
        status:
          $ref: '#/components/schemas/SessionStatus'
        tier:
          $ref: '#/components/schemas/SessionTier'
        stage:
          $ref: '#/components/schemas/FightStage'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/FightTurn'
          description: Answered history for this owner only; empty after terminal cleanup.
        currentTurn:
          anyOf:
          - $ref: '#/components/schemas/TurnResponse'
          - type: 'null'
        thermometerStart:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        thermometerEnd:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        createdAt: *id002
      allOf:
      - if:
          properties:
            status:
              const: in_progress
        then:
          properties:
            currentTurn:
              $ref: '#/components/schemas/NextTurnResponse'
      - if:
          properties:
            status:
              const: awaiting_payment
        then:
          properties:
            currentTurn:
              $ref: '#/components/schemas/PaywallResponse'
      - if:
          properties:
            status:
              const: completed
        then:
          properties:
            currentTurn:
              $ref: '#/components/schemas/CompletedResponse'
            turns:
              maxItems: 0
      - if:
          properties:
            status:
              const: stopped_safety
        then:
          properties:
            currentTurn:
              $ref: '#/components/schemas/SafetyStopResponse'
            turns:
              maxItems: 0
      - if:
          properties:
            status:
              const: skipped
        then:
          properties:
            currentTurn:
              type: 'null'
            turns:
              maxItems: 0
    FightSessionResultResponse:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - fightRecordId
      - neutralTopic
      - feltText
      - needText
      - openingLine
      - sharedRules
      - partnerStatus
      - thermometerStart
      - thermometerEnd
      - tier
      - locked
      properties:
        sessionId: *id001
        fightRecordId:
          type:
          - string
          - 'null'
          minLength: 1
          description: Journal record for this session's exact round after both partners are ready; null before then. Remains the old record for an old session.
        neutralTopic:
          $ref: '#/components/schemas/FightTopic'
        feltText:
          type: string
          description: Private derived feeling summary.
        needText:
          type: string
          description: Private derived need summary.
        openingLine:
          type: string
          description: Private first sentence; empty while locked.
        sharedRules:
          type: array
          items:
            type: string
          description: The same three neutral conversation rules.
          minItems: 3
          maxItems: 3
        partnerStatus:
          $ref: '#/components/schemas/PartnerBStatus'
        thermometerStart:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        thermometerEnd:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        tier:
          $ref: '#/components/schemas/SessionTier'
        locked:
          type: array
          items:
            type: string
            enum:
            - openingLine
            - inviteUrl
          description: Empty when full access is available.
          uniqueItems: true
    CreateCheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - plan
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
    CreateCheckoutResponse:
      type: object
      additionalProperties: false
      required:
      - checkoutUrl
      - checkoutSessionId
      properties:
        checkoutUrl:
          type: string
          description: Absolute Stripe test checkout URL, or clearly marked frontend demo checkout URL. Do not infer payment
            success from this URL.
        checkoutSessionId: *id001
    ConfirmCheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - checkoutSessionId
      properties:
        checkoutSessionId: *id001
    SubmitRatingRequest:
      type: object
      additionalProperties: false
      required:
      - rating
      properties:
        rating:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
    FightRecordResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - startedAt
      - bothReadyAt
      - ratingA
      - ratingB
      - averageRating
      - color
      - status
      - divergenceFlag
      properties:
        id: *id001
        topic:
          $ref: '#/components/schemas/FightTopic'
        startedAt: *id002
        bothReadyAt:
          type:
          - string
          - 'null'
          description: RFC 3339 timestamp in UTC.
          format: date-time
        ratingA:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        ratingB:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        averageRating:
          type:
          - number
          - 'null'
          description: Mean of both numeric ratings; absent average is null.
          minimum: 1
          maximum: 10
        color:
          $ref: '#/components/schemas/RatingColor'
        status:
          $ref: '#/components/schemas/RecordStatus'
        divergenceFlag:
          type: boolean
          description: True only with two numeric ratings whose difference reaches the configured threshold (default 4).
    JournalEntryResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - topic
      - startedAt
      - bothReadyAt
      - ratingA
      - ratingB
      - averageRating
      - color
      - status
      - divergenceFlag
      - myResult
      properties:
        id: *id001
        topic:
          $ref: '#/components/schemas/FightTopic'
        startedAt: *id002
        bothReadyAt:
          type:
          - string
          - 'null'
          description: RFC 3339 timestamp in UTC.
          format: date-time
        ratingA:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        ratingB:
          type:
          - integer
          - 'null'
          description: Integer scale from 1 through 10.
          minimum: 1
          maximum: 10
        averageRating:
          type:
          - number
          - 'null'
          description: Mean of both numeric ratings; absent average is null.
          minimum: 1
          maximum: 10
        color:
          $ref: '#/components/schemas/RatingColor'
        status:
          $ref: '#/components/schemas/RecordStatus'
        divergenceFlag:
          type: boolean
          description: True only with two numeric ratings whose difference reaches the configured threshold (default 4).
        myResult:
          description: The caller's own private result for this round, or null if unavailable. The partner's result is never included.
          anyOf:
          - $ref: '#/components/schemas/FightSessionResultResponse'
          - type: 'null'
    JournalResponse:
      type: array
      items:
        $ref: '#/components/schemas/FightRecordResponse'
      description: Shared records oldest first (ID breaks equal timestamps); [] when empty.
    JournalStatsResponse:
      type: object
      additionalProperties: false
      required:
      - totalFights
      - topicCounts
      - averageRatingTrend
      - avgTimeToBothReadySeconds
      - recurringTopicHint
      properties:
        totalFights:
          type: integer
          minimum: 0
        topicCounts:
          type: object
          propertyNames:
            $ref: '#/components/schemas/FightTopic'
          additionalProperties:
            type: integer
            minimum: 1
          description: Only topics present in the journal; {} when empty.
        averageRatingTrend:
          type: array
          items:
            type: number
            minimum: 1
            maximum: 10
          description: Available two-person averages in chronological order.
        avgTimeToBothReadySeconds:
          type: integer
          description: Mean elapsed seconds, truncated to integer; zero when there are no records.
          minimum: 0
        recurringTopicHint:
          anyOf:
          - $ref: '#/components/schemas/FightTopic'
          - type: 'null'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: User-readable explanation; do not branch on its wording.
    EmptyRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
